name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify HID++ decoding fixtures
        run: bash scripts/test.sh
      - name: Build universal release
        run: bash scripts/build-release.sh
      - name: Upload compiled archive
        uses: actions/upload-artifact@v4
        with:
          name: Logi-Dashboard-Lite-macOS-universal
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
